workflow:
  id: kaven-quality-council
  name: kaven-quality-council
  description: 'Cross-squad workflow that orchestrates quality consultations between kaven-squad agents and mmos-squad quality
    minds (Kent Beck, Daniel Kahneman). Used for testing strategy decisions, risk analysis, TDD methodology, quality metrics,
    and test prioritization across the Kaven platform.

    '
  type: cross-squad
  version: 1.0.0
  trigger:
    manual: true
    command: '@kaven *quality-council'
    aliases:
    - '@kaven *qc'
    - '@kaven *quality-review'
  input:
    required:
    - quality_question: string
    - scope: string
    optional:
    - context_files: list
    - requesting_agent: string
    - framework: string
    - urgency: string
  output:
  - quality_decision: string
  - council_transcript: string
  - action_items: list
  - evidence_bundle:
    - council_transcript.md
    - action_items.md
    - dissenting_views.md
  execution_modes:
    yolo:
      prompts: 0
      description: Full autonomous execution — loads minds, runs debate, synthesizes, returns recommendations
    interactive:
      prompts: 3
      description: Confirms mind selection, presents perspectives, asks for approval before finalizing
    preflight:
      prompts: 5
      description: Reviews question framing, confirms scope, validates minds, presents plan before execution
  success_criteria:
  - Quality question receives perspectives from at least 1 quality mind
  - Recommendation includes concrete action items with assignees
  - Feasibility validated by Shield
  - Evidence bundle generated
  failure_handling:
    mind_load_failure:
      action: Proceed with available minds. Minimum 1 mind required.
    debate_timeout:
      action: Skip cross-pollination, use individual perspectives for synthesis.
    shield_unavailable:
      action: Skip feasibility review, note as pending in evidence bundle.
  tags:
  - cross-squad
  - quality
  - testing
  - consultation
  - mmos-integration
  - quality-council
  sequence:
  - id: frame_question
    name: Frame the Quality Question
    agent: kaven-qa
    description: 'Shield frames the quality/testing question with context about the current test suite, quality metrics, risk
      factors, and the specific decision that needs to be made. Identifies which quality aspects are relevant and what the
      decision''s impact is.

      '
    input:
    - quality_question
    - scope
    - context_files
    output:
    - framed_question: string
    - constraints: list
    - affected_areas: list
    on_failure: skip_to_load_minds
  - id: load_minds
    name: Load Quality Mind System Prompts
    agent: kaven-qa
    description: 'Shield loads the quality mind system prompts from mmos-squad based on the scope of the question. Different
      scopes prioritize different minds.

      '
    depends_on:
    - frame_question
    input:
    - scope
    - urgency
    mind_selection:
      strategy:
        primary:
        - kent_beck
        - daniel_kahneman
        optional: []
      tdd:
        primary:
        - kent_beck
        optional:
        - daniel_kahneman
      risk:
        primary:
        - daniel_kahneman
        - kent_beck
        optional: []
      coverage:
        primary:
        - kent_beck
        optional:
        - daniel_kahneman
    mind_paths:
      kent_beck: squads/mmos-squad/minds/kent_beck/system_prompts/system-prompt-dev-workflow-v1.0.md
      daniel_kahneman: squads/mmos-squad/minds/daniel_kahneman/system_prompts/20251007_132021-v1.0-generalista.md
    output:
    - loaded_minds: list
    - token_budget: number
  - id: individual_perspectives
    name: Gather Individual Perspectives
    agent: kaven-qa
    description: 'Shield channels each loaded quality mind sequentially, presenting the framed question and capturing their
      unique perspective using their cognitive frameworks.

      '
    depends_on:
    - load_minds
    input:
    - framed_question
    - constraints
    - loaded_minds
    output:
    - perspectives: map
    execution_rules:
    - Each mind responds using their specific frameworks and vocabulary
    - Kent Beck applies TDD methodology (Red-Green-Refactor), test quality assessment, simple design
    - CRITICAL - Kent Beck for Quality Council focuses on TDD methodology and test strategy, NOT architecture
    - Daniel Kahneman applies System 1/System 2 thinking, cognitive biases, risk analysis, decision psychology
  - id: cross_pollination
    name: Cross-Pollination Debate
    agent: kaven-qa
    description: 'Minds respond to each other''s perspectives. Each mind identifies the strongest point from the other mind
      and builds on it or challenges it. Uses the specified debate framework to structure the exchange. With 2 minds, this
      is always a duo exchange.

      '
    depends_on:
    - individual_perspectives
    skip_if: urgency == "quick"
    input:
    - perspectives
    - framework
    output:
    - debate_transcript: string
    - consensus_points: list
    - dissenting_views: list
    frameworks:
      steel_man:
        rounds: 2
        rules: Each mind must articulate the BEST version of the other's perspective before defending their own
      socratic:
        rounds: 3
        rules: Minds ask probing questions of each other, drilling into assumptions
      hegelian:
        rounds: 2
        rules: Thesis -> Antithesis -> Synthesis progression toward resolution
  - id: synthesize
    name: Synthesize Recommendations
    agent: kaven-qa
    description: 'Shield synthesizes all perspectives and debate into a consolidated recommendation. Identifies consensus,
      notes dissenting views, and translates into actionable steps.

      '
    depends_on:
    - cross_pollination
    input:
    - perspectives
    - debate_transcript
    - consensus_points
    - dissenting_views
    - constraints
    output:
    - recommendation: string
    - action_items: list
    - trade_offs: list
  - id: feasibility_review
    name: QA Feasibility Review
    agent: kaven-qa
    description: 'Shield reviews the quality recommendation for feasibility within Kaven''s testing constraints. Validates
      that the proposed approach works with current test infrastructure (Jest, Vitest, Prisma utilities), multi-tenant testing
      patterns, CI/CD pipeline, and team capacity.

      '
    depends_on:
    - synthesize
    input:
    - recommendation
    - action_items
    - affected_areas
    output:
    - feasibility_verdict: string
    - testing_notes: list
    - revised_action_items: list
    on_failure: use_original_recommendation
  - id: generate_evidence
    name: Generate Evidence Bundle
    agent: kaven-qa
    description: 'Compile the complete consultation into an evidence bundle for traceability.

      '
    depends_on:
    - feasibility_review
    output:
    - evidence_bundle:
        council_transcript: 'Full transcript with framed question, individual perspectives, cross-pollination debate, synthesis,
          and feasibility review.

          '
        action_items: 'Final action items with assignee (which kaven-squad agent executes each).

          '
        dissenting_views: 'Documented disagreements with reasoning for the chosen path.

          '
