workflow:
  id: kaven-product-council
  name: kaven-product-council
  description: 'Cross-squad workflow that orchestrates product consultations between kaven-squad agents and mmos-squad product
    minds (Marty Cagan, Jeff Patton, Cagan+Patton duo). Used for product discovery, story mapping, strategy decisions, and
    validation questions that affect product direction, roadmap prioritization, or user experience across the Kaven platform.

    '
  type: cross-squad
  version: 1.0.0
  trigger:
    manual: true
    command: '@kaven *product-council'
    aliases:
    - '@kaven *pc'
    - '@kaven *product-review'
  input:
    required:
    - product_question: string
    - scope: string
    optional:
    - context_files: list
    - requesting_agent: string
    - framework: string
    - urgency: string
  output:
  - product_decision: string
  - council_transcript: string
  - action_items: list
  - evidence_bundle:
    - council_transcript.md
    - action_items.md
    - dissenting_views.md
  execution_modes:
    yolo:
      prompts: 0
      description: Full autonomous execution — loads minds, runs debate, synthesizes, returns recommendations
    interactive:
      prompts: 3
      description: Confirms mind selection, presents perspectives, asks for approval before finalizing
    preflight:
      prompts: 5
      description: Reviews question framing, confirms scope, validates minds, presents plan before execution
  success_criteria:
  - Product question receives perspectives from at least 2 product minds
  - Recommendation includes concrete action items with assignees
  - Feasibility is reviewed for roadmap/capacity alignment
  - Evidence bundle is generated for traceability
  failure_handling:
    mind_load_failure:
      action: Proceed with available minds. Minimum 1 mind required.
    debate_timeout:
      action: Skip cross-pollination, use individual perspectives for synthesis.
    feasibility_unavailable:
      action: Skip feasibility review, note as pending in evidence bundle.
  tags:
  - cross-squad
  - product-council
  - consultation
  - mmos-integration
  - product-management
  sequence:
  - id: frame_question
    name: Frame the Product Question
    agent: kaven-squad-lead
    description: 'Steave (Squad Lead) frames the product question with business and user context. Identifies which user problems
      are relevant, what business metrics matter, and what the decision''s impact is on roadmap and resources.

      '
    input:
    - product_question
    - scope
    - context_files
    output:
    - framed_question: string
    - constraints: list
    - affected_areas: list
    on_failure: skip_to_load_minds
  - id: load_minds
    name: Load Product Mind System Prompts
    agent: kaven-squad-lead
    description: 'Steave loads the product mind system prompts from mmos-squad based on the scope of the question. Different
      scopes prioritize different minds based on their expertise (discovery, story mapping, strategy, validation).

      '
    depends_on:
    - frame_question
    input:
    - scope
    - urgency
    mind_selection:
      discovery:
        primary:
        - marty_cagan
        - cagan_patton
        optional:
        - jeff_patton
      story:
        primary:
        - jeff_patton
        - cagan_patton
        optional:
        - marty_cagan
      strategy:
        primary:
        - marty_cagan
        - jeff_patton
        - cagan_patton
      validation:
        primary:
        - cagan_patton
        - marty_cagan
        optional:
        - jeff_patton
    mind_paths:
      marty_cagan: squads/mmos-squad/minds/marty_cagan/system_prompts/system-prompt-discovery-coach.md
      jeff_patton: squads/mmos-squad/minds/jeff_patton/system_prompts/system-prompt-generalista-v1.0.md
      cagan_patton: squads/mmos-squad/minds/cagan_patton/system_prompts/system-prompt-product-strategist.md
    output:
    - loaded_minds: list
    - token_budget: number
  - id: individual_perspectives
    name: Gather Individual Perspectives
    agent: kaven-squad-lead
    description: 'Steave channels each loaded product mind sequentially, presenting the framed question and capturing their
      unique perspective using their cognitive frameworks.

      '
    depends_on:
    - load_minds
    input:
    - framed_question
    - constraints
    - loaded_minds
    output:
    - perspectives: map
    execution_rules:
    - Each mind responds using their specific frameworks and vocabulary
    - Marty Cagan applies Opportunity Solution Tree, Discovery/Delivery, Continuous Discovery
    - Jeff Patton applies Story Mapping, User-Centered Design, Opportunity Mapping
    - Cagan+Patton duo applies integrated product strategy, dual-track agile thinking
  - id: cross_pollination
    name: Cross-Pollination Debate
    agent: kaven-squad-lead
    description: 'Minds respond to each other''s perspectives. Each mind identifies the strongest point from another mind
      and builds on it or challenges it. Uses the specified debate framework to structure the exchange.

      '
    depends_on:
    - individual_perspectives
    skip_if: urgency == "quick"
    input:
    - perspectives
    - framework
    output:
    - debate_transcript: string
    - consensus_points: list
    - dissenting_views: list
    frameworks:
      steel_man:
        rounds: 2
        rules: Each mind must articulate the BEST version of a competing perspective before defending their own
      socratic:
        rounds: 3
        rules: Minds ask probing questions of each other, drilling into assumptions
      hegelian:
        rounds: 2
        rules: Thesis -> Antithesis -> Synthesis progression toward resolution
  - id: synthesize
    name: Synthesize Recommendations
    agent: kaven-squad-lead
    description: 'Steave synthesizes all perspectives and debate into a consolidated recommendation. Identifies consensus,
      notes dissenting views, and translates into actionable steps with clear ownership assignments to kaven-squad agents.

      '
    depends_on:
    - cross_pollination
    input:
    - perspectives
    - debate_transcript
    - consensus_points
    - dissenting_views
    - constraints
    output:
    - recommendation: string
    - action_items: list
    - trade_offs: list
  - id: feasibility_review
    name: Product/Engineering Feasibility Review
    agent: kaven-squad-lead
    description: 'Steave reviews the product recommendation for feasibility in the context of Kaven''s current roadmap, technical
      capacity, and business constraints. Validates that the proposed approach aligns with sprint capacity and architectural
      direction (may consult Architect if needed).

      '
    depends_on:
    - synthesize
    input:
    - recommendation
    - action_items
    - affected_areas
    output:
    - feasibility_verdict: string
    - product_notes: list
    - revised_action_items: list
    on_failure: use_original_recommendation
  - id: generate_evidence
    name: Generate Evidence Bundle
    agent: kaven-squad-lead
    description: 'Compile the complete consultation into an evidence bundle for traceability. Document the full decision-making
      process for future reference and to enable informed iteration if the product direction changes.

      '
    depends_on:
    - feasibility_review
    output:
    - evidence_bundle:
        council_transcript: 'Full transcript with framed question, individual perspectives, cross-pollination debate, synthesis,
          and feasibility review.

          '
        action_items: 'Final action items with assignee (which kaven-squad agent executes each).

          '
        dissenting_views: 'Documented disagreements with reasoning for the chosen path.

          '
