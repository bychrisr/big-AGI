workflow:
  id: kaven-architecture-council
  name: kaven-architecture-council
  description: 'Cross-squad workflow that orchestrates architecture consultations between kaven-squad agents and mmos-squad
    architecture minds (Mitchell Hashimoto, Kent Beck, Guillermo Rauch). Used for technical decisions affecting infrastructure,
    testing architecture, developer experience, or system design across the Kaven platform.

    '
  type: cross-squad
  version: 1.0.0
  trigger:
    manual: true
    command: '@kaven *architecture-council'
    aliases:
    - '@kaven *ac'
    - '@kaven *arch-review'
  input:
    required:
    - architecture_question: string
    - scope: string
    optional:
    - context_files: list
    - requesting_agent: string
    - framework: string
    - urgency: string
  output:
  - architecture_decision: string
  - council_transcript: string
  - action_items: list
  - evidence_bundle:
    - council_transcript.md
    - action_items.md
    - dissenting_views.md
  execution_modes:
    yolo:
      prompts: 0
      description: Full autonomous execution — loads minds, runs debate, synthesizes, returns recommendations
    interactive:
      prompts: 3
      description: Confirms mind selection, presents perspectives, asks for approval before finalizing
    preflight:
      prompts: 5
      description: Reviews question framing, confirms scope, validates minds, presents plan before execution
  success_criteria:
  - Architecture question receives perspectives from at least 2 minds
  - Recommendation includes concrete action items with assignees
  - Feasibility validated by Atlas
  - Evidence bundle generated
  failure_handling:
    mind_load_failure:
      action: Proceed with available minds. Minimum 1 mind required.
    debate_timeout:
      action: Skip cross-pollination, use individual perspectives for synthesis.
    architect_unavailable:
      action: Skip feasibility review, note as pending in evidence bundle.
  tags:
  - cross-squad
  - architecture
  - consultation
  - mmos-integration
  - architecture-council
  sequence:
  - id: frame_question
    name: Frame the Architecture Question
    agent: kaven-architect
    description: 'The Architect (Atlas) frames the architecture question with technical context. Identifies which architectural
      constraints are relevant, what patterns are already in use, and what the decision''s blast radius is.

      '
    input:
    - architecture_question
    - scope
    - context_files
    output:
    - framed_question: string
    - constraints: list
    - affected_areas: list
    on_failure: skip_to_load_minds
  - id: load_minds
    name: Load Architecture Mind System Prompts
    agent: kaven-architect
    description: 'Atlas loads the architecture mind system prompts from mmos-squad based on the scope of the question. Different
      scopes prioritize different minds.

      '
    depends_on:
    - frame_question
    input:
    - scope
    - urgency
    mind_selection:
      infrastructure:
        primary:
        - mitchell_hashimoto
        - kent_beck
        optional:
        - guillermo_rauch
      testing:
        primary:
        - kent_beck
        - guillermo_rauch
        optional:
        - mitchell_hashimoto
      dx:
        primary:
        - guillermo_rauch
        - kent_beck
        optional:
        - mitchell_hashimoto
      system:
        primary:
        - mitchell_hashimoto
        - kent_beck
        - guillermo_rauch
        optional: []
    mind_paths:
      mitchell_hashimoto: squads/mmos-squad/minds/mitchell_hashimoto/system_prompts/system-prompt-infrastructure-expert-v1.0.md
      kent_beck: squads/mmos-squad/minds/kent_beck/system_prompts/system-prompt-dev-workflow-v1.0.md
      guillermo_rauch: squads/mmos-squad/minds/guillermo_rauch/system_prompts/system-prompt-dx-specialist-v1.0.md
    output:
    - loaded_minds: list
    - token_budget: number
  - id: individual_perspectives
    name: Gather Individual Perspectives
    agent: kaven-architect
    description: 'Atlas channels each loaded architecture mind sequentially, presenting the framed question and capturing
      their unique perspective using their cognitive frameworks.

      '
    depends_on:
    - load_minds
    input:
    - framed_question
    - constraints
    - loaded_minds
    output:
    - perspectives: map
    execution_rules:
    - Each mind responds using their specific frameworks and vocabulary
    - Mitchell Hashimoto applies Infrastructure Design, System Patterns, Distribution Primitives
    - Kent Beck applies Test-First Development, Simple Design, Refactoring Patterns
    - Guillermo Rauch applies Developer Experience, Edge Computing, Zero-Configuration
  - id: cross_pollination
    name: Cross-Pollination Debate
    agent: kaven-architect
    description: 'Minds respond to each other''s perspectives. Each mind identifies the strongest point from another mind
      and builds on it or challenges it. Uses the specified debate framework to structure the exchange.

      '
    depends_on:
    - individual_perspectives
    skip_if: urgency == "quick"
    input:
    - perspectives
    - framework
    output:
    - debate_transcript: string
    - consensus_points: list
    - dissenting_views: list
    frameworks:
      steel_man:
        rounds: 2
        rules: Each mind must articulate the BEST version of a competing perspective before defending their own
      socratic:
        rounds: 3
        rules: Minds ask probing questions of each other, drilling into assumptions
      hegelian:
        rounds: 2
        rules: Thesis -> Antithesis -> Synthesis progression toward resolution
  - id: synthesize
    name: Synthesize Recommendations
    agent: kaven-architect
    description: 'Atlas synthesizes all perspectives and debate into a consolidated recommendation. Identifies consensus,
      notes dissenting views, and translates into actionable steps.

      '
    depends_on:
    - cross_pollination
    input:
    - perspectives
    - debate_transcript
    - consensus_points
    - dissenting_views
    - constraints
    output:
    - recommendation: string
    - action_items: list
    - trade_offs: list
  - id: architect_review
    name: Architectural Feasibility Review
    agent: kaven-architect
    description: 'Atlas reviews the architecture recommendation for feasibility within Kaven''s constraints. Validates that
      the proposed approach works with multi-tenancy, performance budgets, security requirements, and existing infrastructure
      patterns.

      '
    depends_on:
    - synthesize
    input:
    - recommendation
    - action_items
    - affected_areas
    output:
    - feasibility_verdict: string
    - technical_notes: list
    - revised_action_items: list
    on_failure: use_original_recommendation
  - id: generate_evidence
    name: Generate Evidence Bundle
    agent: kaven-architect
    description: 'Compile the complete consultation into an evidence bundle for traceability.

      '
    depends_on:
    - architect_review
    output:
    - evidence_bundle:
        council_transcript: 'Full transcript with framed question, individual perspectives, cross-pollination debate, synthesis,
          and architectural review.

          '
        action_items: 'Final action items with assignee (which kaven-squad agent executes each).

          '
        dissenting_views: 'Documented disagreements with reasoning for the chosen path.

          '
