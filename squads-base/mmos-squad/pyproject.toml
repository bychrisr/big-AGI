[project]
name = "teamai-debate-engine"
version = "0.1.0"
description = "Motor de debates cognitivos do teamAI usando Anthropic API"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.43.0",
    "pyyaml>=6.0",
    "supabase>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["debate_engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
