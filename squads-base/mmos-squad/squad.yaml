id: mmos-squad
name: MMOS Squad
version: "1.0"
description: |
  Hub cognitivo central do teamAI. Fornece acesso a 32 minds (clones cognitivos
  de thought leaders), debate engine, e análise cognitiva profunda.

role: brain
type: shared  # Compartilhado entre todos os usuários via symlink

provides:
  - minds           # 32 clones cognitivos
  - debate_engine   # debate_engine.py — debates estruturados entre minds
  - cognitive_analysis
  - greenfield_pipeline

minds_count: 32

