token_budgets:
  single_mind_target: 15000
  growth_council_target: 60000    # 5 minds
  oxford_debate_target: 80000     # 2 minds
  context_window_max: 200000      # Claude Sonnet

optimization_layers:
  - name: kb_compression
    description: "extract_relevant_chunks() — 40k → 5-8k tokens (~85% redução)"
  - name: session_caching
    description: "System prompt carregado 1x por sessão, turnos = delta"
  - name: multi_persona_call
    description: "Minds leves (<20k) em chamada única. NUNCA para Hormozi"
  - name: session_persistence
    description: "Supabase sessions — *resume [session_id]"
